codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: auto
        threshold: 1%
        base: auto
    patch:
      default:
        target: auto
        threshold: 1%

ignore:
  - "tests/"
  - "setup.py"
  - "**/__init__.py"
  - "database/migrations/"

comment:
  layout: "reach,diff,flags,tree,reach"
  behavior: default
  require_changes: no
