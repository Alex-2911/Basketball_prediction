<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Basketball Prediction Dashboard</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: #f8fafc;
      }
      main {
        text-align: center;
        padding: 2.5rem 3rem;
        border-radius: 1.5rem;
        background: rgba(15, 23, 42, 0.85);
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.45);
        max-width: 540px;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 2rem;
      }
      p {
        margin: 0 0 1.5rem;
        font-size: 1.05rem;
        color: #cbd5f5;
      }
      a {
        color: #38bdf8;
        font-weight: 600;
        text-decoration: none;
        border-bottom: 2px solid transparent;
        transition: border-color 0.2s ease;
      }
      a:hover,
      a:focus {
        border-color: currentColor;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Basketball Prediction Dashboard</h1>
      <p>CI pipeline is running. Website is live.</p>
      <a href="https://github.com/Alex-2911/Basketball_prediction">View the GitHub repository</a>
    </main>
  </body>
</html>
