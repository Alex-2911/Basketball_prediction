name: "🏀 3. Build Predictions & Betting Lines (Today)"

permissions:
  contents: write

concurrency:
  group: nba-step-3-predict
  cancel-in-progress: true

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["🏀 2. Collect Next Game Data"]
    types: [completed]

jobs:
  build_predictions:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (branch 2026)
        uses: actions/checkout@v4
        with:
          ref: 2026
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run prediction / model pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          echo "=== Starting model / feature build / predictions ==="
          python 2026/src/3_predict_games_hybrid_2026.py
          echo "=== Script finished ==="

      - name: Upload prediction artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: today_predictions
          path: 2026/output/LightGBM/*.csv
          if-no-files-found: warn

      - name: Commit prediction CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add 2026/output/LightGBM/*.csv || true

          if git diff --cached --quiet; then
            echo "No new predictions to commit."
          else
            git commit -m "auto-add daily predictions ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push origin 2026
          fi
