name: 🏀 1. Collect and Prepare NBA Game Data (Previous Game Day)

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 16 * * *"  # every evening (UTC)
  workflow_dispatch: {}

jobs:
  collect_data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (branch 2026)
        uses: actions/checkout@v4
        with:
          ref: 2026
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Cache WebDriverManager
        uses: actions/cache@v3
        with:
          path: ~/.wdm
          key: webdriver-manager-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            webdriver-manager-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data collection (previous game day)
        env:
          CURRENT_SEASON: "2026"
        run: |
          echo "=== Starting scrape for PREVIOUS game day ==="
          python 2026/src/1_get_data_previous_game_day_2026.py

      - name: Commit updated scraped game data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add 2026/output/Gathering_Data/Whole_Statistic \
                  2026/output/Gathering_Data/data/2026_scores \
                  2026/output/Gathering_Data/data/2026_standings || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "auto-update scraped game data ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push origin 2026
          fi
