name: Calculate Betting Statistics

on:
  push:
    branches:
      - patch/node-schema-fix-2026

jobs:
  setup-node:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'

  build-dashboard:
    runs-on: ubuntu-latest
    needs: setup-node
    steps:
      - name: Build Dashboard Assets
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: build-dashboard
    steps:
      - name: Deploy
        run: npm run deploy
