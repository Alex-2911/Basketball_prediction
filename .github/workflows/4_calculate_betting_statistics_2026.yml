name: "🏀 4. Update Betting Statistics + Shortlist (Scripts 4 & 5)"

permissions:
  contents: write

concurrency:
  group: nba-step-4-5-stats-shortlist
  cancel-in-progress: true

on:
  workflow_dispatch:

  workflow_run:
    workflows: ["🏀 3. Build Predictions & Betting Lines (Today)"]
    types: [completed]

jobs:
  update_betting_stats_and_shortlist:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      STRATEGY_VARIANT: iso

    steps:
      - name: Checkout repository (branch 2026)
        uses: actions/checkout@v4
        with:
          ref: 2026
          fetch-depth: 0

      - name: Set up Python 3.11 (with pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install jupyter nbconvert

      # -----------------------
      # Script 4
      # -----------------------
      - name: Run betting statistics updater (Script 4)
        run: |
          echo "=== Running betting statistics update (Script 4) ==="
          python 2026/src/4_calculate_betting_statistics_2026.py
          echo "=== Script 4 finished ==="

      - name: Upload Script 4 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: betting_statistics_outputs
          path: |
            2026/output/LightGBM/combined_nba_predictions_acc*.csv
          if-no-files-found: warn

      # -----------------------
      # Script 5
      # -----------------------
      - name: Run Isotonic shortlist + bet log engine (Script 5)
        run: |
          echo "=== Running isotonic shortlist + bet log update (Script 5) ==="
          SOURCE_ROOT=$GITHUB_WORKSPACE/2026 python scripts/run_script5.py
          echo "=== Script 5 finished ==="

      - name: Verify metrics snapshot output
        run: |
          ls -la 2026/output/LightGBM | head -n 50
          test -f 2026/output/LightGBM/metrics_snapshot.json

      - name: Upload metrics snapshot
        uses: actions/upload-artifact@v4
        with:
          name: metrics-snapshot
          path: 2026/output/LightGBM/metrics_snapshot.json
          if-no-files-found: error

      - name: Upload Script 5 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: betting_shortlist_and_logs
          path: |
            2026/output/LightGBM/bet_log_live.csv
            2026/output/LightGBM/bet_log_live_*.csv
            2026/output/LightGBM/bet_shortlist_*.csv
            2026/output/LightGBM/home_win_rates_sorted_*.csv
            2026/output/LightGBM/betting_summary_*.xlsx
            2026/output/LightGBM/local_matched_games_*.csv
            2026/output/LightGBM/metrics_snapshot.json
            2026/output/LightGBM/strategy_params.txt
            2026/output/LightGBM/Kelly/*.csv
          if-no-files-found: warn

      # -----------------------
      # Commit everything once
      # -----------------------
      - name: Commit and push updated LightGBM outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add 2026/output/LightGBM || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            commit_msg="auto-update betting stats & shortlist ($(date -u +%Y-%m-%dT%H:%MZ))"
            git commit -m "$commit_msg"
            git push origin 2026
          fi
