[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "nba-pregame-2027"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "pyarrow>=17", "scikit-learn>=1.5", "lightgbm>=4"]
[project.scripts]
nba-pregame = "nba2027.candidates:main"
[tool.setuptools.packages.find]
where = ["src"]
